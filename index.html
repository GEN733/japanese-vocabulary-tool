            function extractChineseMeanings(rawChinese) {
                const cleaned = rawChinese.replace(/【[^】]*】/g, '').replace(/（[^）]*）/g, '');
                return cleaned.split(/[,;，；/、]/).map(s => s.trim()).filter(Boolean);
            }

            window.checkAnswer = function() {
                const question = practiceWords[currentIndex];
                if (!question) return;
                const ans = document.getElementById('answerInput').value.trim();
                if (!ans) return;

                if (question.type === 'multi') {
                    if (currentMultiAnswers.includes(ans)) {
                        document.getElementById('resultMessage').className = 'result-badge wrong';
                        document.getElementById('resultMessage').innerText = '⚠️ 这个含义已经输入过了';
                        document.getElementById('answerInput').value = '';
                        scrollToResult();
                        return;
                    }
                    currentMultiAnswers.push(ans);
                    renderMultiAnswers();
                    document.getElementById('answerInput').value = '';
                    document.getElementById('resultMessage').innerHTML = '';
                    if (currentMultiAnswers.length >= question.meanings.length) finalizeMultiAnswer(question);
                    else document.getElementById('answerInput').focus();
                    return;
                }

                const word = question.item;
                const isJp2Cn = question.direction === 'jp2cn';
                if (isGrammarPractice || isJp2Cn) {
                    let correct;
                    if (isJp2Cn) {
                        const rawChinese = word.chinese;
                        const aliases = extractChineseMeanings(rawChinese);
                        correct = aliases.some(a => a === ans);
                    } else {
                        correct = (ans === word.japanese);
                    }
                    document.getElementById('resultMessage').className = correct ? 'result-badge correct' :
                        'result-badge wrong';
                               if (correct) {
                stats.correct++;
                let msg = '✓ 正确';
                if (!isGrammarPractice && isJp2Cn) {
                    const allChineseSet = new Set();
                    allVocabularies.filter(v => v.japanese === word.japanese).forEach(v => {
                        extractChineseMeanings(v.chinese).forEach(meaning => allChineseSet.add(meaning));
                    });
                    const allChinese = Array.from(allChineseSet).join(' / ');
                    msg += `<br>含义：${allChinese}`;
                }
                document.getElementById('resultMessage').innerHTML = msg;
                document.getElementById('resultMessage').className = 'result-badge correct';
                if (!handleCorrectForWrongPractice(word)) return;
            }
                    } else {
                        stats.wrong++;
                        document.getElementById('resultMessage').innerText =
                            `✗ 错误 正确答案: ${isJp2Cn ? word.chinese : word.japanese}`;
                        addToWrong(word);
                    }
                    if (word.example && !isGrammarPractice) {
                        document.getElementById('exampleCard').innerHTML = `📖 ${word.example}`;
                        document.getElementById('exampleCard').style.display = 'block';
                    } else if (isGrammarPractice && word.example) {
                        document.getElementById('exampleCard').innerHTML =
                            `📖 ${word.example} ${word.exampleCn||''}`;
                        document.getElementById('exampleCard').style.display = 'block';
                    }
                    answerState = 'completed';
                    updateProgress();
                    scrollToResult();
                } else {
                    if (answerState === 'initial') {
                        const kanaOk = (ans === word.japanese);
                        currentKanaCorrect = kanaOk;
                        if (isVerbMode && isVerb(word)) {
                            document.getElementById('previewText').innerText = kanaOk ? '✓ 假名正确，请输入助词' :
                                '✗ 假名错误，仍需输入助词';
                            if (word.example) { document.getElementById('exampleCard').innerHTML = '📖 ' + word
                                    .example.replace('___', '<span>＿＿</span>');
                                document.getElementById('exampleCard').style.display = 'block'; }
                            answerState = 'waitingParticle';
                            document.getElementById('answerInput').value = '';
                            document.getElementById('answerInput').placeholder = '输入助词（が/を/に）';
                            document.getElementById('answerInput').focus();
                        } else {
                            if (kanaOk) { stats.correct++; if (!handleCorrectForWrongPractice(word))
                                return;
                                document.getElementById('resultMessage').className = 'result-badge correct';
                                document.getElementById('resultMessage').innerText = '✓ 正确'; } else { stats
                                    .wrong++;
                                document.getElementById('resultMessage').className = 'result-badge wrong';
                                document.getElementById('resultMessage').innerText =
                                    `✗ 错误 正确答案: ${word.japanese}`;
                                addToWrong(word); }
                            answerState = 'completed';
                            updateProgress();
                            scrollToResult();
                        }
                    } else if (answerState === 'waitingParticle') {
                        const correctParticle = word.particle || '';
                        const particleOk = (ans === correctParticle);
                        if (currentKanaCorrect && particleOk) { stats.correct++; if (!
                                handleCorrectForWrongPractice(word)) return;
                            document.getElementById('resultMessage').className = 'result-badge correct';
                            document.getElementById('resultMessage').innerText =
                                `✓ 正确！「${word.japanese}」${word.wordType||''}（${correctParticle}）`; } else {
                            stats.wrong++;
                            let msg = '✗ 错误'; if (!currentKanaCorrect) msg += ` 假名: ${word.japanese}`; if (!
                                particleOk) msg += ` 助词: ${ans} (应为 ${correctParticle||'无'})`;
                            document.getElementById('resultMessage').className = 'result-badge wrong';
                            document.getElementById('resultMessage').innerText = msg;
                            addToWrong(word); }
                        answerState = 'completed';
                        document.getElementById('answerInput').placeholder = '输入日语假名';
                        updateProgress();
                        scrollToResult();
                    }
                }
            };

            function finalizeMultiAnswer(question) {
                const meanings = question.meanings;
                const userSet = currentMultiAnswers;
                let allMatched = true;
                for (const meaning of meanings) {
                    if (!userSet.some(ans => meaning.aliases.some(alias => alias === ans))) { allMatched = false;
                        break; }
                }
                const isCorrect = allMatched && userSet.length === meanings.length;
                let msg = `已输入含义：${userSet.join('、')}<br>`;
                if (isCorrect) { stats.correct++;
                    document.getElementById('resultMessage').className = 'result-badge correct';
                    msg += '✓ 完全正确！'; } else { stats.wrong++;
                    document.getElementById('resultMessage').className = 'result-badge wrong';
                    const allAliases = meanings.map(m => m.aliases.join('/')).join('、');
                    msg += `✗ 错误，正确答案：${allAliases}`;
                    addToWrong(question.item); }
                document.getElementById('resultMessage').innerHTML = msg;
                const exampleSet = new Set();
                meanings.forEach(meaning => { meaning.items.forEach(item => { if (item.example) { const exampleStr =
                            `📖 ${item.example}${item.exampleCn ? ' ' + item.exampleCn : ''}`;
                        exampleSet.add(exampleStr); } }); });
                if (exampleSet.size > 0) { document.getElementById('exampleCard').innerHTML = Array.from(exampleSet)
                        .join('<br>');
                    document.getElementById('exampleCard').style.display = 'block'; } else document.getElementById(
                    'exampleCard').style.display = 'none';
                document.getElementById('multiHint').style.display = 'none';
                document.getElementById('answerListArea').style.display = 'none';
                answerState = 'completed';
                updateProgress();
                scrollToResult();
                if (isCorrect && !handleCorrectForWrongPractice(question.item)) { answerState = 'pendingChoice'; return; }
            }

            function addToWrong(word) {
                const listId = getWrongListIdForCurrent();
                const targetList = getWrongListById(listId);
                if (!targetList) return;
                const addToList = (list) => {
                    const existing = list.find(w => w.chinese === word.chinese && w.japanese === word.japanese);
                    if (existing) { existing.wrongCount = (existing.wrongCount || 1) + 1; } else { list.push({ chinese: word
                                .chinese, japanese: word.japanese, wrongCount: 1 }); }
                };
                addToList(targetList);
                if (listId === 'wordUnitCnJp') addToList(wordSummaryCnJpWrong);
                if (listId === 'wordUnitJpCn') addToList(wordSummaryJpCnWrong);
                if (listId === 'verbUnit') addToList(verbSummaryWrong);
                if (listId === 'grammarUnitCnJp') addToList(grammarSummaryCnJpWrong);
                if (listId === 'grammarUnitJpCn') addToList(grammarSummaryJpCnWrong);
                saveAll();
            }

                        pendingWrongAction.item) return; } else if (answerState !== 'completed') { checkAnswer(); if (

                if (currentIndex + 1 < practiceWords.length) { currentIndex++;

            async function githubRequest(url, opt = {}) { opt.headers = { ...opt.headers, Authorization: `token ${githubConfig.token}`,
                    Accept: 'application/vnd.github.v3+json' }; const r = await fetch(url, opt); if (!r.ok) { const e =

            function packData() {
                const syncMeta = {
                    device: getDeviceName(),
                    time: new Date().toISOString()
                };
                const data = {
                    allDecks,
                    allVocabularies,
                    wordUnitCnJpWrong,
                    wordSummaryCnJpWrong,
                    wordUnitJpCnWrong,
                    wordSummaryJpCnWrong,
                    verbUnitWrong,
                    verbSummaryWrong,
                    grammarUnitCnJpWrong,
                    grammarSummaryCnJpWrong,
                    grammarUnitJpCnWrong,
                    grammarSummaryJpCnWrong,
                    settings,
                    uploadHistory,
                    _syncMeta: syncMeta
                };
                const jsonStr = JSON.stringify(data);
                const compressed = pako.deflate(jsonStr);
                return { packed: btoa(String.fromCharCode.apply(null, compressed)), meta: syncMeta };
            }

            function unpackData(b64) {
                const binaryStr = atob(b64);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) { bytes[i] = binaryStr.charCodeAt(i); }
                const jsonStr = pako.inflate(bytes, { to: 'string' });
                return JSON.parse(jsonStr);
            }

                a.click(); };
            window.importBackup = function() { const file = document.getElementById('importFile').files[0]; if (!file)
            return; const reader = new FileReader();
                reader.onload = (e) => { try { const data = JSON.parse(e.target.result); if (data.allDecks) allDecks = data
                            .allDecks; if (data.allVocabularies) allVocabularies = data.allVocabularies;
                        wordUnitCnJpWrong = data.wordUnitCnJpWrong || [];
                        wordSummaryCnJpWrong = data.wordSummaryCnJpWrong || [];
                        wordUnitJpCnWrong = data.wordUnitJpCnWrong || [];
                        wordSummaryJpCnWrong = data.wordSummaryJpCnWrong || [];
                        verbUnitWrong = data.verbUnitWrong || [];
                        verbSummaryWrong = data.verbSummaryWrong || [];
                        grammarUnitCnJpWrong = data.grammarUnitCnJpWrong || [];
                        grammarSummaryCnJpWrong = data.grammarSummaryCnJpWrong || [];
                        grammarUnitJpCnWrong = data.grammarUnitJpCnWrong || [];
                        grammarSummaryJpCnWrong = data.grammarSummaryJpCnWrong || [];
                        settings = data.settings || { practiceCount: 0 };
                        uploadHistory = data.uploadHistory || [];
                        saveAll();
                        alert('导入完成');
                        renderBookLists();
                        renderWrongList();
                        fillAllSelects(); } catch (ex) { alert('解析失败: ' + ex.message); } };
                reader.readAsText(file); };
            window.resetAllData = () => { if (confirm('⚠️ 删除所有数据？')) { allDecks = [];
                    allVocabularies = [];
                    wordUnitCnJpWrong = [];
                    wordSummaryCnJpWrong = [];
                    wordUnitJpCnWrong = [];
                    wordSummaryJpCnWrong = [];
                    verbUnitWrong = [];
                    verbSummaryWrong = [];
                    grammarUnitCnJpWrong = [];
                    grammarSummaryCnJpWrong = [];
                    grammarUnitJpCnWrong = [];
                    grammarSummaryJpCnWrong = [];
                    unitWrong = [];
                    summaryWrong = [];
                    verbWrong = [];
                    grammarUnitWrong = [];
                    grammarSummaryWrong = [];
                    wordJnCnWrong = [];
                    settings = { practiceCount: 0 };
                    uploadHistory = [];
                    lastUploadInfo = null;
                    lastDownloadInfo = null;
                    cloudSyncMeta = null;
                    saveAll(); } };
            window.changePracticeCount = () => { const s = document.getElementById('practiceCountSelect'); if (s.value ===
                    'custom') document.getElementById('customCountRow').style.display = 'flex'; else { settings
                    .practiceCount = parseInt(s.value);
                    saveAll();
                    document.getElementById('customCountRow').style.display = 'none'; } };
            window.applyCustomCount = () => { const v = parseInt(document.getElementById('customCountInput').value); if (v >
                    0) { settings.practiceCount = v;
                    saveAll();
                    document.getElementById('customCountRow').style.display = 'none'; } };

            loadFromStorage();
            fillAllSelects();
            renderBookLists();
            renderWrongList();
            fillGithubConfigToUI();
            document.getElementById('practiceCountSelect').value = settings.practiceCount === 0 ? '0' : (settings
                .practiceCount > 0 ? String(settings.practiceCount) : '0');
            updatePracticeCategory();
            updateWrongTabActiveStates();
            document.getElementById('answerInput').placeholder = '输入答案，回车确认';
            updateVerbTabVisibility();
            // 初始加载时获取云端信息
            if (githubConfig.gistId && githubConfig.token) {
                fetchCloudSyncMeta().then(() => updateSyncInfoDisplay());
            }
        })();
    </script>
</body>
</html>
