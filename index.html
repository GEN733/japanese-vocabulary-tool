            function updateSpacedUI() {
                const today = getTodayStr();
                // 单词统计
                const wordItems = state.spaced.filter(item => item.category === 'word');
                const wordDue = wordItems.filter(item => item.nextReviewDate <= today);
                const wordTodayEl = document.getElementById('wordSpacedTodayCount');
                const wordTotalEl = document.getElementById('wordSpacedTotalCount');
                if (wordTodayEl) wordTodayEl.innerText = wordDue.length;
                if (wordTotalEl) wordTotalEl.innerText = wordItems.length;
                // 语法统计
                const grammarItems = state.spaced.filter(item => item.category === 'grammar');
                const grammarDue = grammarItems.filter(item => item.nextReviewDate <= today);
                const grammarTodayEl = document.getElementById('grammarSpacedTodayCount');
                const grammarTotalEl = document.getElementById('grammarSpacedTotalCount');
                if (grammarTodayEl) grammarTodayEl.innerText = grammarDue.length;
                if (grammarTotalEl) grammarTotalEl.innerText = grammarItems.length;
                if (state.spaced.subTab === 'library') renderSpacedWordList();
            }

            window.searchSpacedWords = function() {
                state.spaced.searchKeyword = document.getElementById('spacedSearchInput').value.trim().toLowerCase();
                renderSpacedWordList();
            };

            window.clearSpacedSearch = function() {
                document.getElementById('spacedSearchInput').value = '';
                state.spaced.searchKeyword = '';
                const repEl = document.getElementById('spacedFilterRep');
                const intEl = document.getElementById('spacedFilterInterval');
                if (repEl) repEl.value = '';
                if (intEl) intEl.value = '';
                renderSpacedWordList();
            };

            function renderSpacedWordList() {
                const container = document.getElementById('spacedWordList');
                if (!state.spaced.length) { container.innerHTML = '<p>暂无单词，请从汇总错题导入</p>'; return; }
                const today = getTodayStr();
                let filtered = state.spaced.slice();
                if (state.spaced.searchKeyword) {
                    const kw = state.spaced.searchKeyword;
                    filtered = filtered.filter(item => item.chinese.toLowerCase().includes(kw) || item.japanese.toLowerCase().includes(kw));
                }
                const repMin = parseInt(document.getElementById('spacedFilterRep')?.value);
                const intMin = parseInt(document.getElementById('spacedFilterInterval')?.value);
                if (!isNaN(repMin)) filtered = filtered.filter(item => item.repetitions >= repMin);
                if (!isNaN(intMin)) filtered = filtered.filter(item => item.interval >= intMin);
                const key = state.spaced.sortKey;
                if (key) {
                    const order = state.spaced.sortOrder === 'desc' ? -1 : 1;
                    filtered.sort((a, b) => {
                        let valA = a[key], valB = b[key];
                        if (typeof valA === 'string') valA = valA.toLowerCase();
                        if (typeof valB === 'string') valB = valB.toLowerCase();
                        if (valA < valB) return -1 * order;
                        if (valA > valB) return 1 * order;
                        return 0;
                    });
                }
                if (!filtered.length) { container.innerHTML = '<p>无匹配单词</p>'; return; }
                const getSortIcon = (colKey) => {
                    if (state.spaced.sortKey !== colKey) return ' ↕';
                    return state.spaced.sortOrder === 'asc' ? ' ↑' : ' ↓';
                };
                let html = '<table class="word-table"><tr>';
                html += `<th style="cursor:pointer;" onclick="toggleSort('chinese')">中文${getSortIcon('chinese')}</th>`;
                html += `<th style="cursor:pointer;" onclick="toggleSort('japanese')">日文${getSortIcon('japanese')}</th>`;
                html += `<th style="cursor:pointer;" onclick="toggleSort('repetitions')">复习次数${getSortIcon('repetitions')}</th>`;
                html += `<th style="cursor:pointer;" onclick="toggleSort('interval')">间隔${getSortIcon('interval')}</th>`;
                html += `<th style="cursor:pointer;" onclick="toggleSort('nextReviewDate')">下次复习${getSortIcon('nextReviewDate')}</th>`;
                html += '<th>操作</th></tr>';
                filtered.forEach((item) => {
                    const originalIdx = state.spaced.indexOf(item);
                    const dueSoon = item.nextReviewDate <= today ? ' (今日)' : '';
                    html += `<tr><td>${item.chinese}</td><td>${item.japanese}</td><td>${item.repetitions}</td><td>${item.interval}天</td><td>${item.nextReviewDate}${dueSoon}</td><td><button class="btn-sm danger" onclick="removeSpacedItemByFilter(${originalIdx})">移除</button></td></tr>`;
                });
                html += '</table>';
                container.innerHTML = html;
            }

            window.importSummaryToSpaced = function(category) {
                let source;
                if (category === 'grammar') {
                    source = state.wrong.grammarSummaryJpCn;
                    if (!source.length) { alert('语法汇总错题（日→中）中没有内容可导入'); return; }
                } else {
                    source = state.wrong.wordSummaryCnJp;
                    if (!source.length) { alert('单词汇总错题（中→日）中没有内容可导入'); return; }

            let added = 0;
            source.forEach(ww => {
                    let fullChinese = ww.chinese;

                        const relatedVocabs = state.vocabs.filter(v => v.category === 'grammar' && v.japanese === ww.japanese);
                        if (relatedVocabs.length > 0) {
                            const meaningSet = new Set();
                            relatedVocabs.forEach(v => {
                                v.chinese.split('/').map(s => s.trim()).filter(Boolean).forEach(meaning => meaningSet.add(meaning));
                            });
                            if (meaningSet.size > 0) {
                                fullChinese = Array.from(meaningSet).join('/');
                            }
                        }
                    }
                    if (!state.spaced.some(s => s.chinese === fullChinese && s.japanese === ww.japanese && s.category === category)) {
                        state.spaced.push({
                            chinese: fullChinese,
                            japanese: ww.japanese,
                            category: category,
                            direction: category === 'grammar' ? 'jp2cn' : 'cn2jp',
                            repetitions: 0,
                            easeFactor: 2.5,
                            interval: 0,
                            nextReviewDate: getTodayStr()
                        });
                        added++;
                    }

            if (added > 0) { saveAll(); updateSpacedUI(); alert(`已导入 ${added} 个新条目`); }

                    state.spaced = [];

            function sm2Update(item, quality) {
                if (quality < 3) {
                    item.repetitions = 0;
                    item.interval = 1;
                    item.easeFactor = Math.max(1.3, item.easeFactor - 0.2);
                } else {
                    if (item.repetitions === 0) item.interval = 1;
                    else if (item.repetitions === 1) item.interval = 6;
                    else item.interval = Math.round(item.interval * item.easeFactor);
                    item.repetitions += 1;
                    item.easeFactor = item.easeFactor + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
                    if (item.easeFactor < 1.3) item.easeFactor = 1.3;
                }
                const nextDate = new Date();
                nextDate.setDate(nextDate.getDate() + item.interval);
                // 使用本地日期，避免 UTC 偏移导致日期卡在当天
                const yyyy = nextDate.getFullYear();
                const mm = String(nextDate.getMonth() + 1).padStart(2, '0');
                const dd = String(nextDate.getDate()).padStart(2, '0');
                item.nextReviewDate = `${yyyy}-${mm}-${dd}`;
            }

            window.startSpacedPractice = function(category) {
                const today = getTodayStr();
                const dueItems = state.spaced.filter(item => item.category === category && item.nextReviewDate <= today);
                if (!dueItems.length) {
                    alert(category === 'grammar' ? '今天没有需要复习的语法' : '今天没有需要复习的单词');
                    return;
                }
                for (let i = dueItems.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [dueItems[i], dueItems[j]] = [dueItems[j], dueItems[i]];
                }
                state.spaced.currentCategory = category;
                state.spaced.practiceWords = dueItems;
                state.spaced.index = 0;
                state.spaced.stats = { total: dueItems.length, correct: 0, wrong: 0 };
                state.spaced.pendingAction = null;
                state.spaced.currentItem = null;
                document.getElementById('spacedSubTabBar').style.display = 'none';
                document.getElementById('spacedPracticeArea').style.display = 'block';
                document.getElementById('spacedFixedInputArea').style.display = 'block';
                document.getElementById('spacedWrongActionBar').style.display = 'none';
                showSpacedQuestion();
            };

            function showSpacedQuestion() {
                state.spaced.answerState = 'answering';
                const s = state.spaced;
                const total = s.practiceWords.length;
                const answered = s.stats.correct + s.stats.wrong;
                const current = s.index + 1;
                document.getElementById('spacedProgressCurr').innerText = current;
                document.getElementById('spacedProgressTotal').innerText = total;
                document.getElementById('spacedTotalAnswered').innerText = answered;
                document.getElementById('spacedCorrectRate').innerText = answered ? Math.round(s.stats.correct / answered * 100) : 0;
                document.getElementById('spacedProgressFill').style.width = total ? ((current / total) * 100) + '%' : '0%';
                if (!s.practiceWords.length || s.index >= s.practiceWords.length) {
                    document.getElementById('spacedSubTabBar').style.display = 'flex';
                    document.getElementById('spacedPracticeArea').style.display = 'none';
                    document.getElementById('spacedFixedInputArea').style.display = 'none';
                    // 强制切换到“题库”标签，让更新后的日期立刻可见
                    state.spaced.subTab = 'library';
                    document.getElementById('spacedPracticeTab').style.display = 'none';
                    document.getElementById('spacedLibraryTab').style.display = 'block';
                    document.querySelectorAll('#spacedSubTabBar .sub-tab-btn').forEach(b => b.classList.remove('active'));
                    document.querySelector('#spacedSubTabBar .sub-tab-btn:last-child').classList.add('active');
                    updateSpacedUI();
                    alert(`复习完成！正确:${s.stats.correct} 错误:${s.stats.wrong}`);
                    return;
                }
                const item = s.practiceWords[s.index];
                s.currentItem = item;
                s.answerState = 'answering';
                s.multiAnswers = [];        // 重置多义答案列表
                s.multiRequiredCount = 0;   // 重置所需义项数

                // 清空结果消息、多义列表和例句区域
                document.getElementById('spacedResultMessage').innerHTML = '';
                document.getElementById('spacedMultiAnswerList').style.display = 'none';
                document.getElementById('spacedMultiAnswerList').innerHTML = '';
                document.getElementById('spacedExampleCard').style.display = 'none';
                document.getElementById('spacedExampleCard').innerHTML = '';

                if (item.category === 'grammar') {
                    // 语法：显示日文，输入中文
                    document.getElementById('spacedQuestionWord').innerHTML = item.japanese;
                    document.getElementById('spacedAnswerInput').placeholder = '输入中文意思';

                    // 检查是否有多个义项（用 / 分隔）
                    const aliases = item.chinese.split('/').map(x => x.trim()).filter(Boolean);
                    if (aliases.length > 1) {
                        // 多义模式
                        s.answerState = 'multi';
                        s.multiRequiredCount = aliases.length;
                        document.getElementById('spacedAnswerInput').placeholder = '输入其中一个中文含义';
                        document.getElementById('spacedResultMessage').innerHTML = `该语法有 <b>${aliases.length}</b> 个含义，请逐个输入`;
                    }
                } else {
                    // 单词：显示中文（及词性），输入日文假名
                    const vocab = state.vocabs.find(v => v.chinese === item.chinese && v.japanese === item.japanese);
                    let displayHtml = item.chinese;
                    if (vocab && vocab.wordType) displayHtml += ` <span class="type-badge${vocab.wordType.includes('他')?' 他':''}">${vocab.wordType}</span>`;
                    document.getElementById('spacedQuestionWord').innerHTML = displayHtml;
                    document.getElementById('spacedAnswerInput').placeholder = '输入日语假名';
                }

                document.getElementById('spacedPreviewText').innerText = '';
                document.getElementById('spacedWrongActionBar').style.display = 'none';
                document.getElementById('spacedAnswerInput').disabled = false;
                document.getElementById('spacedAnswerInput').value = '';
                document.getElementById('spacedAnswerInput').focus();
            }

            function handleSpacedMultiAnswer(userAnswer) {
                const s = state.spaced;
                const item = s.currentItem;
                if (!item) return;

                // 检查重复
                if (s.multiAnswers.includes(userAnswer)) {
                    document.getElementById('spacedResultMessage').className = 'result-badge wrong';
                    document.getElementById('spacedResultMessage').innerHTML = '⚠️ 这个含义已经输入过了';
                    document.getElementById('spacedAnswerInput').value = '';
                    return;
                }

                s.multiAnswers.push(userAnswer);

                // 显示已输入含义
                const listDiv = document.getElementById('spacedMultiAnswerList');
                listDiv.style.display = 'block';
                listDiv.innerHTML = '<strong>已输入含义：</strong><br>' + s.multiAnswers.map((a, i) => `${i+1}. ${a}`).join('<br>');
                document.getElementById('spacedAnswerInput').value = '';

                // 如果输入数量达到要求，进行最终判定
                if (s.multiAnswers.length >= s.multiRequiredCount) {
                    finalizeSpacedMultiAnswer();
                }
            }

            function finalizeSpacedMultiAnswer() {
                const s = state.spaced;
                const item = s.currentItem;
                if (!item) return;

                const aliases = item.chinese.split('/').map(x => x.trim()).filter(Boolean);
                const userSet = s.multiAnswers;

                // 检查是否每个义项都有匹配（顺序无关）
                let allMatched = true;
                for (const alias of aliases) {
                    if (!userSet.some(ans => normalizeString(ans) === normalizeString(alias))) {
                        allMatched = false;
                        break;
                    }
                }
                const isCorrect = allMatched && userSet.length === aliases.length;

                // 更新统计和间隔
                const quality = isCorrect ? 5 : 1;
                s.stats.correct += isCorrect ? 1 : 0;
                s.stats.wrong += isCorrect ? 0 : 1;
                sm2Update(item, quality);

                // 显示结果
                const msgDiv = document.getElementById('spacedResultMessage');
                let msg = `已输入含义：${userSet.join('、')}<br>`;
                if (isCorrect) {
                    msgDiv.className = 'result-badge correct';
                    msg += '✓ 完全正确！';
                } else {
                    msgDiv.className = 'result-badge wrong';
                    msg += `✗ 错误，正确答案：${aliases.join('、')}`;
                }
                msgDiv.innerHTML = msg;

                // 显示例句
                showSpacedExample(item);

                // 处理“已掌握”逻辑
                if (isCorrect && item.interval >= 30) {
                    msgDiv.innerHTML += `<br>🎉 已掌握！<br>是否从遗忘曲线数据库移出？`;
                    document.getElementById('spacedWrongActionBar').style.display = 'flex';
                    document.getElementById('spacedAnswerInput').disabled = true;
                    s.pendingAction = { type: 'mastered', item };
                } else {
                    document.getElementById('spacedWrongActionBar').style.display = 'none';
                    s.pendingAction = null;
                }

                // 隐藏多义列表
                document.getElementById('spacedMultiAnswerList').style.display = 'none';
                s.answerState = 'completed';
                updateSpacedUI();
                saveAll();
            }

            function showSpacedExample(item) {
                const exDiv = document.getElementById('spacedExampleCard');
                // 根据 japanese 查找所有相关词条（支持多义词多条记录）
                const relatedVocabs = state.vocabs.filter(v => v.japanese === item.japanese);
                if (relatedVocabs.length === 0) {
                    exDiv.style.display = 'none';
                    return;
                }
                // 收集所有例句（去重）
                const exampleSet = new Set();
                relatedVocabs.forEach(v => {
                    if (v.example) {
                        const ex = `📖 ${v.example}${v.exampleCn ? ' ' + v.exampleCn : ''}`;
                        exampleSet.add(ex);
                    }
                });
                if (exampleSet.size > 0) {
                    exDiv.innerHTML = Array.from(exampleSet).join('<br>');
                    exDiv.style.display = 'block';
                } else {
                    exDiv.style.display = 'none';
                }
            }

            function checkSpacedAnswer(userAnswer) {
                const s = state.spaced;
                const item = s.currentItem;
                if (!item) return;
                let isCorrect = false;
                if (item.category === 'grammar') {
                    // 语法日→中：匹配中文释义（支持多个义项）
                    const aliases = item.chinese.split('/').map(s => s.trim()).filter(Boolean);
                    const normalizedAns = normalizeString(userAnswer);
                    isCorrect = aliases.some(a => normalizeString(a) === normalizedAns);
                } else {
                    // 单词中→日
                    isCorrect = (userAnswer === item.japanese);
                }
                const quality = isCorrect ? 5 : 1;
                s.stats.correct += isCorrect ? 1 : 0;
                s.stats.wrong += isCorrect ? 0 : 1;
                sm2Update(item, quality);
                updateSpacedUI();
                if (isCorrect && item.interval >= 30) {
                    document.getElementById('spacedResultMessage').className = 'result-badge correct';
                    document.getElementById('spacedResultMessage').innerHTML = `🎉 已掌握！<br>是否从遗忘曲线数据库移出？`;
                    showSpacedExample(item);
                    document.getElementById('spacedWrongActionBar').style.display = 'flex';
                    document.getElementById('spacedAnswerInput').disabled = true;
                    s.pendingAction = { type: 'mastered', item };
                } else if (isCorrect) {
                    document.getElementById('spacedResultMessage').className = 'result-badge correct';
                    document.getElementById('spacedResultMessage').innerHTML = `✓ 正确！下次复习：${item.nextReviewDate}（间隔${item.interval}天）`;
                    showSpacedExample(item);
                    document.getElementById('spacedWrongActionBar').style.display = 'none';
                    s.pendingAction = null;
                } else {
                    document.getElementById('spacedResultMessage').className = 'result-badge wrong';
                    const correctAnswer = item.category === 'grammar' ? item.chinese : item.japanese;
                    document.getElementById('spacedResultMessage').innerHTML = `✗ 错误！正确答案：${correctAnswer}。已重置，明天再复习。`;
                    showSpacedExample(item);
                    document.getElementById('spacedWrongActionBar').style.display = 'none';
                    s.pendingAction = null;
                }
                if (!s.pendingAction || s.pendingAction.type !== 'mastered') {
                    s.answerState = 'completed';
                }
                saveAll();
            }

                    const item = state.spaced.pendingAction.item;

            // ========== 同步相关 ==========
            async function githubRequest(url, opt = {}) {
                opt.headers = { ...opt.headers, Authorization: `token ${state.github.token}`, Accept: 'application/vnd.github.v3+json' };
                const r = await fetch(url, opt);
                if (!r.ok) { const e = await r.json().catch(() => ({ message: r.statusText })); throw new Error(e.message || `HTTP ${r.status}`); }
                return r.json();
            }

            function packData() {
                const syncMeta = { device: getDeviceName(), time: new Date().toISOString() };
                let cleanData;
                try {
                    cleanData = JSON.parse(JSON.stringify({
                        allDecks: state.decks,
                        allVocabularies: state.vocabs,
                        wordUnitCnJpWrong: state.wrong.wordUnitCnJp,
                        wordSummaryCnJpWrong: state.wrong.wordSummaryCnJp,
                        wordUnitJpCnWrong: state.wrong.wordUnitJpCn,
                        wordSummaryJpCnWrong: state.wrong.wordSummaryJpCn,
                        verbUnitWrong: state.wrong.verbUnit,
                        verbSummaryWrong: state.wrong.verbSummary,
                        grammarUnitCnJpWrong: state.wrong.grammarUnitCnJp,
                        grammarSummaryCnJpWrong: state.wrong.grammarSummaryCnJp,
                        grammarUnitJpCnWrong: state.wrong.grammarUnitJpCn,
                        grammarSummaryJpCnWrong: state.wrong.grammarSummaryJpCn,
                        spacedRepetitionData: state.spaced,
                        settings: state.settings,
                        uploadHistory: state.uploadHistory,
                        _syncMeta: syncMeta
                    }));
                } catch (e) {
                    alert('数据序列化失败，可能是数据损坏。请先导出备份，清空数据后再导入。');
                    throw e;
                }
                const jsonStr = JSON.stringify(cleanData);
                const compressed = pako.deflate(jsonStr);
                let binaryStr = '';
                for (let i = 0; i < compressed.length; i++) {
                    binaryStr += String.fromCharCode(compressed[i]);
                }
                return { packed: btoa(binaryStr), meta: syncMeta };
            }

            function unpackData(b64) {
                const binaryStr = atob(b64);
                const bytes = new Uint8Array(binaryStr.length);
                for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
                const jsonStr = pako.inflate(bytes, { to: 'string' });
                return JSON.parse(jsonStr);
            }

            async function fetchCloudSyncMeta() {
                if (!state.github.gistId || !state.github.token) return null;
                try {
                    const gist = await githubRequest(`https://api.github.com/gists/${state.github.gistId}`);
                    const file = gist.files['japanese_words_backup.json'];
                    if (!file) return null;
                    const data = unpackData(file.content);
                    if (data._syncMeta) { state.cloudSyncMeta = data._syncMeta; saveAll(); return state.cloudSyncMeta; }
                    return null;
                } catch (e) { console.warn('获取云端信息失败', e); return null; }
            }

                    state.wrong.grammarSummaryCnJp = data.grammarSummaryCnJpWrong || [];
                    state.wrong.grammarUnitJpCn = data.grammarUnitJpCnWrong || [];

            window.fetchGistIdFromList = async () => {
                if (!state.github.token) { alert('保存token'); return; }
                try {
                    const gists = await githubRequest('https://api.github.com/gists');
                    const candidates = gists.filter(g => g.files['japanese_words_backup.json']);

                    let list = '';
                    candidates.forEach((g, i) => list += `${i+1}: ${g.id}\n`);

                        if (chosen) { state.github.gistId = chosen.id; document.getElementById('gistIdInput').value = chosen.id; saveGithubConfig(); }
                    }
                } catch (e) { alert(e.message); }

            window.exportBackup = () => {
                const data = { allDecks: state.decks, allVocabularies: state.vocabs, ...state.wrong, spacedRepetitionData: state.spaced, settings: state.settings, uploadHistory: state.uploadHistory, _syncMeta: { device: getDeviceName(), time: new Date().toISOString() } };
                const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = `日语备份_${new Date().toISOString().slice(0,10)}.json`;
                a.click();
            };

            window.importBackup = function() {
                const file = document.getElementById('importFile').files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (data.allDecks) state.decks = data.allDecks;
                        if (data.allVocabularies) state.vocabs = data.allVocabularies;
                        state.wrong.wordUnitCnJp = data.wordUnitCnJpWrong || [];
                        state.wrong.wordSummaryCnJp = data.wordSummaryCnJpWrong || [];
                        state.wrong.wordUnitJpCn = data.wordUnitJpCnWrong || [];
                        state.wrong.wordSummaryJpCn = data.wordSummaryJpCnWrong || [];
                        state.wrong.verbUnit = data.verbUnitWrong || [];
                        state.wrong.verbSummary = data.verbSummaryWrong || [];
                        state.wrong.grammarUnitCnJp = data.grammarUnitCnJpWrong || [];
                        state.wrong.grammarSummaryCnJp = data.grammarSummaryCnJpWrong || [];
                        state.wrong.grammarUnitJpCn = data.grammarUnitJpCnWrong || [];
                        state.wrong.grammarSummaryJpCn = data.grammarSummaryJpCnWrong || [];
                        state.spaced = data.spacedRepetitionData || [];
                        state.settings = data.settings || { practiceCount: 0 };
                        state.uploadHistory = data.uploadHistory || [];
                        saveAll();
                        alert('导入完成');
                        renderBookLists();
                        renderWrongList();
                        fillAllSelects();
                    } catch (ex) { alert('解析失败: ' + ex.message); }
                };
                reader.readAsText(file);
            };

            window.resetAllData = () => {
                if (confirm('⚠️ 删除所有数据？')) {
                    state.decks = []; state.vocabs = []; state.spaced = [];
                    for (let k in state.wrong) state.wrong[k] = [];
                    state.settings = { practiceCount: 0 };
                    state.uploadHistory = [];
                    state.lastUploadInfo = state.lastDownloadInfo = state.cloudSyncMeta = null;
                    saveAll();
                }
            };

            window.changePracticeCount = () => {
                const s = document.getElementById('practiceCountSelect');
                if (s.value === 'custom') document.getElementById('customCountRow').style.display = 'flex';
                else { state.settings.practiceCount = parseInt(s.value); saveAll(); document.getElementById('customCountRow').style.display = 'none'; }
            };

            window.applyCustomCount = () => {
                const v = parseInt(document.getElementById('customCountInput').value);
                if (v > 0) { state.settings.practiceCount = v; saveAll(); document.getElementById('customCountRow').style.display = 'none'; }
            };

            window.saveGithubConfig = () => {
                state.github.username = document.getElementById('githubUser').value.trim();
                state.github.token = document.getElementById('githubToken').value.trim();
                state.github.gistId = document.getElementById('gistIdInput').value.trim();
                localStorage.setItem('jp_github', JSON.stringify(state.github));
                document.getElementById('configStatus').innerHTML = '✅ 已保存';
                setTimeout(() => document.getElementById('configStatus').innerHTML = '', 2000);
            };

            function fillGithubConfigToUI() {
                document.getElementById('githubUser').value = state.github.username || '';
                document.getElementById('githubToken').value = state.github.token || '';
                document.getElementById('gistIdInput').value = state.github.gistId || '';
            }

            window.toggleModuleCollapse = function(moduleId) {
                const content = document.getElementById(moduleId + 'Content');
                const icon = document.getElementById(moduleId + 'Icon');
                if (content.style.display === 'none') { content.style.display = 'block'; icon.classList.add('open'); }
                else { content.style.display = 'none'; icon.classList.remove('open'); }
            };

            window.editDeck = (id) => { const d = state.decks.find(x => x.id == id); if (!d) return; const n = prompt('名称', d.name); if (n) { d.name = n.trim(); saveAll(); renderBookLists(); } };
            window.deleteDeck = (id) => { if (!confirm('确定删除？')) return; const d = state.decks.find(x => x.id == id); if (d.type === 'book') { const uids = state.decks.filter(u => u.parentId == id).map(u => u.id); state.vocabs = state.vocabs.filter(v => !uids.includes(v.deckId)); state.decks = state.decks.filter(x => !(x.parentId == id || x.id == id)); } else { state.vocabs = state.vocabs.filter(v => v.deckId != id); state.decks = state.decks.filter(x => x.id != id); } saveAll(); renderBookLists(); };
            window.createNewBook = function(category) { const name = prompt(`输入${category==='word'?'单词':'语法'}书本名称`); if (!name) return; state.decks.push({ id: Date.now() + Math.random(), name: name.trim(), type: 'book', category }); saveAll(); renderBookLists(); };
            window.addNewUnit = function(type) { const bookId = document.getElementById(type==='word'?'wordUnitBookSelect':'grammarUnitBookSelect').value; const name = document.getElementById(type==='word'?'wordUnitName':'grammarUnitName').value.trim(); if (!bookId || !name) { alert('请填写完整'); return; } state.decks.push({ id: Date.now() + Math.random(), name, type: 'unit', parentId: bookId }); saveAll(); renderBookLists(); };
            window.editWord = function(id) { const w = state.vocabs.find(v => v.id == id); if (!w) return; const fields = w.category === 'grammar' ? [{ k: 'chinese', l: '中文' }, { k: 'japanese', l: '日语语法' }, { k: 'example', l: '例句' }, { k: 'exampleCn', l: '翻译' }] : [{ k: 'chinese', l: '中文' }, { k: 'japanese', l: '日语' }, { k: 'wordType', l: '词性' }, { k: 'particle', l: '助词' }, { k: 'example', l: '短句' }]; fields.forEach(f => { const v = prompt(f.l, w[f.k] || ''); if (v !== null) w[f.k] = v.trim(); }); saveAll(); clearSearch(); renderBookLists(); };
            window.deleteWord = (id) => { if (!confirm('删除？')) return; state.vocabs = state.vocabs.filter(v => v.id != id); saveAll(); clearSearch(); renderBookLists(); };
            window.importWords = function() { const unitId = document.getElementById('importUnit').value; if (!unitId) { alert('选单元'); return; } const text = document.getElementById('importText').value.trim(); if (!text) return; const lines = text.split('\n'); let added = 0; const cat = document.getElementById('importCategory').value; lines.forEach(line => { const parts = line.trim().split(/\s+/); if (cat === 'word' && parts.length >= 2) { const [ch, ja, wt='', pt='', ...rest] = parts; const ex = rest.join(' '); if (!state.vocabs.some(v => v.chinese === ch && v.japanese === ja)) { state.vocabs.push({ id: Date.now() + Math.random(), chinese: ch, japanese: ja, deckId: unitId, category: 'word', wordType: wt, particle: pt, example: ex }); added++; } } else if (cat === 'grammar' && parts.length >= 2) { const [ch, ja, ex='', exCn=''] = parts; if (!state.vocabs.some(v => v.chinese === ch && v.japanese === ja)) { state.vocabs.push({ id: Date.now() + Math.random(), chinese: ch, japanese: ja, deckId: unitId, category: 'grammar', wordType: '语法', particle: '', example: ex, exampleCn: exCn }); added++; } } }); saveAll(); renderBookLists(); alert(`添加 ${added} 条`); };

            // 事件绑定
            document.getElementById('answerInput').addEventListener('input', function() { document.getElementById('previewText').innerText = this.value; });
            document.getElementById('answerInput').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); if (state.practice.pendingWrong) return; if (state.practice.answerState === 'completed') nextWord(); else checkAnswer(); } });
            document.getElementById('spacedAnswerInput').addEventListener('input', function() { document.getElementById('spacedPreviewText').innerText = this.value; });
            document.getElementById('spacedAnswerInput').addEventListener('keydown', function(e) {
                if (e.key === 'Enter') {
                    e.preventDefault();
                    const s = state.spaced;
                    if (s.pendingAction) return;
                    if (s.answerState === 'completed') {
                        s.index++;
                        showSpacedQuestion();
                        return;
                    }
                    const userAnswer = document.getElementById('spacedAnswerInput').value.trim();
                    if (!userAnswer) return;
                    if (s.answerState === 'multi') {
                        handleSpacedMultiAnswer(userAnswer);
                    } else {
                        checkSpacedAnswer(userAnswer);
                    } 
                }
            });
            document.getElementById('importBook').addEventListener('change', updateImportUnits);

            // 初始化
            loadFromStorage();
            fillAllSelects();
            renderBookLists();
            renderWrongList();
            fillGithubConfigToUI();
            document.getElementById('practiceCountSelect').value = state.settings.practiceCount === 0 ? '0' : String(state.settings.practiceCount);
            updatePracticeCategory();
            updateWrongTabActiveStates();
            document.getElementById('answerInput').placeholder = '输入答案，回车确认';
            updateVerbTabVisibility();
            if (state.github.gistId && state.github.token) fetchCloudSyncMeta().then(() => updateSyncInfoDisplay());
        })();
    </script>
</body>
</html>
